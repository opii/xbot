services:
  postgres:
    image: postgres:15-alpine
    container_name: bot_detector_postgres
    environment:
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password
      POSTGRES_DB: bot_detector_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d bot_detector_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.12.0
    container_name: bot_detector_neo4j
    environment:
      NEO4J_AUTH: neo4j/bot_password
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p bot_password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  # Jednokratni init: gradi Neo4j graf iz Postgres šeme `progress`.
  # Ne pokreće se pri običnom `up` (profil "init"); podaci su perzistentni.
  # Pokretanje:  docker compose --profile init up graph_loader --build
  graph_loader:
    build:
      context: .
      dockerfile: docker/graph_loader.Dockerfile
    container_name: bot_detector_graph_loader
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_DB: bot_detector_db
      PG_USER: bot_user
      PG_PASSWORD: bot_password
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: bot_password
    volumes:
      - ./src:/app/src:ro
    profiles: ["init"]
    restart: "no"

volumes:
  postgres_data:
  neo4j_data:

# Podmreža je FIKSIRANA namerno. Docker podrazumevano bira sledeći slobodan opseg;
# kad su 172.16–172.31 potrošeni (drugi projekti), pređe na 192.168.0.0/20 — što se
# sudara sa tipičnom kućnom mrežom (192.168.0.x). Posledica: host ne može da dođe do
# kontejnera (TCP se otvori, ali handshake nema odgovora), pa API puca na Postgres/Bolt.
networks:
  default:
    ipam:
      config:
        - subnet: 10.77.0.0/16
